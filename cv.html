<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Photo HVS Light - Chelly.io</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="view-photo.css">
</head>
<style>
    /* VARIABEL WARNA PORTFOLIO LIGHT THEME */
:root {
    --cyan-brand: #00bcd4;
    --bg-light-theme: #f4f6f9; /* Background abu-abu terang bersih sesuai index */
    --card-light-theme: #ffffff; /* Putih solid bersih */
    --text-muted-light: #64748b;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-light-theme);
    color: #1e293b;
    transition: background-color 0.3s ease;
}

/* TOMBOL KEMBALI VERSI TEMA TERANG */
.btn-back-light {
    border: 1px solid var(--cyan-brand);
    color: var(--cyan-brand);
    background-color: var(--card-light-theme);
    transition: all 0.3s ease;
}

.btn-back-light:hover {
    background-color: var(--cyan-brand);
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(0, 188, 212, 0.2);
}

/* BINGKAI FOTO RASIO HVS UNTUK TEMA TERANG */
.hvs-photo-card-light {
    max-width: 500px;
    width: 100%;
    aspect-ratio: 1 / 1.414; /* Rasio resmi kertas HVS/A4 memanjang ke bawah */
    border-radius: 20px;
    overflow: hidden;
    background-color: var(--card-light-theme);
    border: 1px solid rgba(0, 0, 0, 0.06); /* Border tipis halus */
}

/* WRAPPER GAMBAR DALAM BINGKAI */
.image-hvs-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #fafafa;
}

.image-hvs-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Mengisi frame HVS dengan rapi tanpa merusak proporsi */
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Efek hover interaktif */
.image-hvs-wrapper:hover img {
    transform: scale(1.03);
}

/* ANIMASI REFRESH MUNCUL */
.animate-fade-in {
    animation: fadeInUp 0.5s ease forwards;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
<body>

    <div class="container min-vh-100 d-flex flex-column align-items-center py-4">
        
        <div class="w-100 d-flex justify-content-start mb-4 animate-fade-in" style="max-width: 500px;">
            <button onclick="goBack()" class="btn btn-back-light rounded-pill px-4 py-2 fw-medium shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Back
            </button>
        </div>
        
        <div class="hvs-photo-card-light shadow animate-fade-in">
            <div class="image-hvs-wrapper">
                <img src="cv.png" alt="Detail Foto Hobi Light" class="img-fluid">
            </div>
        </div>

    </div>

    <script>
        function goBack() {
            window.history.back();
        }
        
    </script>
</body>
</html>
